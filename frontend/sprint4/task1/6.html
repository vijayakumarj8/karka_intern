<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <button ondblclick="fun()">click</button>
    <h2 id="head"></h2>
    <script>
        function fun()
        {
            document.getElementById("head").innerHTML="Button was double clicked!";
        }
    </script>
</body>
</html>
