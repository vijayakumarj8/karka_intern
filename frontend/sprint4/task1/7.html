<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div onmouseenter="fun1()" onmouseleave="fun2()">This is Div</div>
    <p id="para"></p>
    <script>
        var main=document.getElementById("para");
        function fun1()
        {
            main.innerHTML="Mouse Entered";
        }
        function fun2()
        {
            main.innerHTML="Mouse left";
        }
    </script>
    <style>
        div
        {
            width:200px;
            height:200px;
            border:1px solid black;
        }
    </style>
</body>
</html>
